# Builds the app for the simulator on every push, without signing. It's the
# compile check for cloud sessions that can't build iOS themselves. App Store
# builds come from Xcode Cloud (ci_scripts/ci_post_clone.sh).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Pull requests only from forks; own branches are already built on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pinned, so a new Xcode on the runner doesn't turn builds red overnight.
      # Raise it together with the Xcode used in Xcode Cloud.
      XCODE_APP: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s "$XCODE_APP"
      - name: Build app and widgets
        run: >
          xcodebuild -project NASCockpit.xcodeproj -scheme NASCockpit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO -quiet
          build
